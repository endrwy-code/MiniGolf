  <text x="490" y="454" font-size="12" fill="#444441">Plain numbers = measured</text>
  <text x="90" y="482" font-size="12" fill="#5F5E5A">Vertical cable drops every few metres are not shown. Source: floorplan/source-screenshots/.</text>
