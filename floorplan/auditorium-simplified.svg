  <text x="266" y="225" font-size="12" fill="#791F1F" text-anchor="end">ND18 · 101% load</text>
  <circle cx="280" cy="339" r="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="270" y="343" font-size="12" fill="#791F1F" text-anchor="end">ND21 · 106% load</text>

