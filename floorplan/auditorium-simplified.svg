  <text x="283" y="254" font-size="12" fill="#444441" text-anchor="middle">Central strip ≈23.7 × 2.4 m</text>

  <rect x="610" y="228" width="27" height="46" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="604" y="290" font-size="12" fill="#444441" text-anchor="end">Booth?</text>

  <line x1="190" y1="136" x2="470" y2="136" stroke="#E24B4A" stroke-width="1.5"/>
  <line x1="190" y1="355" x2="470" y2="355" stroke="#E24B4A" stroke-width="1.5"/>
  <line x1="95" y1="370" x2="605" y2="370" stroke="#E24B4A" stroke-width="3"/>

  <text x="260" y="182" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Zone A</text>
  <text x="260" y="200" font-size="12" fill="#0F6E56" text-anchor="middle">≈46 × 11.6 m</text>
  <text x="260" y="302" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Zone B</text>
  <text x="260" y="320" font-size="12" fill="#0F6E56" text-anchor="middle">≈46 × 11.6 m</text>

