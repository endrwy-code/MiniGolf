    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="500" fill="#FFFFFF"/>

  <text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">Auditorium, simplified plan</text>
  <text x="40" y="50" font-size="12" fill="#5F5E5A">Countdown party mini golf, 31 Dec 2026. Schematic: positions marked ≈ are estimates.</text>

  <rect x="90" y="110" width="547" height="271" rx="4" fill="#FAFAF7" stroke="#888780" stroke-width="1"/>
  <rect x="150" y="122" width="459.5" height="256" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>

