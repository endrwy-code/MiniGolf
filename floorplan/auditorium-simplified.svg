<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 680 500" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Auditorium, simplified plan with dimensions</title>
  <desc>Auditorium 54.7 by 27.1 metres. Stage zone at the left end, a central strip about 23.7 by 2.4 metres, a control booth at the right, two open floor zones about 46 by 11.6 metres each, main cable runs, and two overloaded circuits. Coordinates match floorplan/auditorium-dimensions.json at 10 px per metre, origin x=90, y=110.</desc>
